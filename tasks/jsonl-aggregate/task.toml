schema_version = "1.4"

[task]
name = "rsiforme/jsonl-aggregate"
version = "0.1.0"
description = "CPU workflow smoke task: optimize exact grouped aggregation while preserving integer semantics."

[metadata]
category = "software"
tags = ["rsiforme", "cpu", "workflow-smoke"]

[metadata.rsi_harness.verifier]
gpus = 0
visibility = "public"
max_submissions = 5

[environment]
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 4096
build_timeout_sec = 600
workdir = "/workspace"
gpus = 0
network_mode = "no-network"

[agent]
timeout_sec = 600
network_mode = "no-network"

[verifier]
timeout_sec = 120
network_mode = "no-network"
environment_mode = "shared"
