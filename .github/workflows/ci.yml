name: CPU workflow checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-11-26
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-11-26
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check canonical task assets
        run: python tasks/jsonl-aggregate/sync_assets.py --check
      - name: Test archive and protocol behavior
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Execute the CPU workflow
        env:
          PYTHONPATH: src
        run: python -m rsiforme demo --store runs/ci-demo
